name: 공식 데이터 동기화 (수동/진단용)

# 제작서 §24 — 국가기관 FACT 는 원래 매일 00:00 KST 정기 동기화를 목표로 했다.
#
# ⚠️ 자동 스케줄은 뗐다. 열린국회정보 API 가 GitHub Actions(해외 클라우드 IP)의 접속을
# 연결 단계에서 막아(CONNECT_TIMEOUT, 인증키와 무관) 매일 00:00 마다 100% 실패하고
# 빨간 X 알림만 쌓였다. 실제 자동 수집은 국내 네트워크에서 도는
# scripts/local-sync.ps1 (사무실 PC, 매일 09:30, Windows 작업 스케줄러)이 담당한다.
#
# 이 워크플로는 수동 실행(workflow_dispatch)만 남겨 둔다 — Actions 환경에서의 연결
# 여부를 다시 확인하고 싶을 때(예: IP 차단이 풀렸는지 점검) 쓰는 진단용이다.
on:
  workflow_dispatch:
    inputs:
      windowDays:
        description: "수집 범위(일)"
        required: false
        default: "120"

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 공식 기록 수집
        id: collect
        continue-on-error: true # 실패해도 아래 로그 커밋 단계까지 진행한다
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          LAW_GO_KR_OC: ${{ secrets.LAW_GO_KR_OC }}
          SYNC_WINDOW_DAYS: ${{ inputs.windowDays || '120' }}
          SYNC_AGE: ${{ vars.SYNC_AGE }}
        run: npm run sync

      # 실패했을 때야말로 로그가 필요하므로, 성공·실패와 무관하게 항상 커밋한다.
      - name: 결과·로그 커밋
        if: always()
        run: |
          if [ -z "$(git status --porcelain src/data/official)" ]; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "watchers-sync[bot]"
          git config user.email "watchers-sync@users.noreply.github.com"
          git add src/data/official
          git commit -m "공식 기록 동기화 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST') [${{ steps.collect.outcome }}]"
          git pull --rebase --autostash
          git push

      - name: 수집 실패 시 잡도 실패로 표시
        if: steps.collect.outcome == 'failure'
        run: |
          echo "수집 단계가 실패했습니다. src/data/official/sync-log.json 에 원인이 기록되어 있습니다."
          exit 1
