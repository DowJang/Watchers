name: 공식 데이터 동기화

# 제작서 §24 — 국가기관 FACT 는 매일 00:00 KST 정기 동기화.
# 서버가 없으므로 Actions 가 수집 → 결과를 커밋 → Pages 배포 워크플로가 이어서 사이트를 갱신한다.
on:
  schedule:
    - cron: "0 15 * * *" # 15:00 UTC = 00:00 KST
  workflow_dispatch:
    inputs:
      windowDays:
        description: "수집 범위(일)"
        required: false
        default: "120"

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 공식 기록 수집
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          LAW_GO_KR_OC: ${{ secrets.LAW_GO_KR_OC }}
          SYNC_WINDOW_DAYS: ${{ inputs.windowDays || '120' }}
          SYNC_AGE: ${{ vars.SYNC_AGE }}
        run: npm run sync

      - name: 변경분 커밋
        run: |
          if [ -z "$(git status --porcelain src/data/official)" ]; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "watchers-sync[bot]"
          git config user.email "watchers-sync@users.noreply.github.com"
          git add src/data/official
          git commit -m "공식 기록 동기화 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          git push
